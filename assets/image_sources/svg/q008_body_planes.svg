<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200">
  <rect x="0" y="0" width="1400" height="1200" fill="#ffffff"/>

  <!-- Oblique (cavalier) projection of a torso block, so the three anatomical
       planes are geometrically distinguishable from a single flat view:
       - sagittal (vertical, L/R split): a vertical plane that recedes into depth -> slanted quad
       - coronal (vertical, front/back split): a plane facing the viewer -> flat rectangle
       - horizontal (transverse, up/down split): a plane lying flat -> slanted "floor" quad
       Front face: X 400-750, Y 280-760. Depth vector (dx,dy) = (260,-160). -->

  <!-- head, on top of the box, same oblique context -->
  <ellipse cx="705" cy="150" rx="88" ry="100" fill="#e8b8ac" stroke="#8a5a4c" stroke-width="4"/>
  <path d="M 672 232 L 672 268 Q 705 286 738 268 L 738 232 Z" fill="#e8b8ac" stroke="#8a5a4c" stroke-width="4"/>

  <!-- torso box: right face, top face, front face (painter's order back-to-front) -->
  <polygon points="750,280 1010,120 1010,600 750,760" fill="#f0c9be" stroke="#8a5a4c" stroke-width="4"/>
  <polygon points="400,280 750,280 1010,120 660,120" fill="#f6dbd3" stroke="#8a5a4c" stroke-width="4"/>
  <polygon points="400,280 750,280 750,760 400,760" fill="#f0c9be" stroke="#8a5a4c" stroke-width="4"/>

  <!-- simple legs for context, hanging from the front-bottom face -->
  <rect x="440" y="760" width="110" height="330" rx="24" fill="#f0c9be" stroke="#8a5a4c" stroke-width="4"/>
  <rect x="600" y="760" width="110" height="330" rx="24" fill="#f0c9be" stroke="#8a5a4c" stroke-width="4"/>

  <!-- CORONAL plane: vertical, splits front/back, faces the viewer directly -->
  <rect x="530" y="200" width="350" height="480" fill="#2f9f5f" opacity="0.38" stroke="#1c6a3d" stroke-width="3"/>

  <!-- HORIZONTAL (transverse) plane: splits upper/lower, lies flat like a floor -->
  <polygon points="400,520 750,520 1010,360 660,360" fill="#e0862f" opacity="0.42" stroke="#a05f18" stroke-width="3"/>

  <!-- SAGITTAL plane: vertical, splits left/right, recedes into depth (drawn last so its diagonal shape stays legible over the other two) -->
  <polygon points="575,280 575,760 835,600 835,120" fill="#2f6fbf" opacity="0.55" stroke="#1c4a86" stroke-width="3"/>

  <!-- small geometric legend tabs (shape/color only, no text) matching each plane's shape family -->
  <polygon points="90,90 90,150 140,132 140,72" fill="#2f6fbf" opacity="0.75"/>
  <rect x="80" y="1090" width="60" height="46" fill="#2f9f5f" opacity="0.75"/>
  <polygon points="1250,1090 1330,1090 1360,1116 1280,1116" fill="#e0862f" opacity="0.75"/>
</svg>
