<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <!-- terminal respiratory unit, zoomed in: respiratory bronchiole -> alveolar duct -> alveolar sac -> alveoli -->

  <!-- respiratory bronchiole (incoming tube, upper-left) -->
  <path d="M 40 260 Q 120 250 190 270 L 190 330 Q 120 315 40 320 Z" fill="#c96a5a" stroke="#7a2a15" stroke-width="5"/>

  <!-- alveolar duct: the central branching corridor, thinning as it goes -->
  <path d="M 190 280 Q 340 290 430 330 Q 520 370 560 430" fill="none" stroke="#c9a06a" stroke-width="24" stroke-linecap="round"/>
  <path d="M 430 330 Q 470 400 480 480" fill="none" stroke="#c9a06a" stroke-width="16" stroke-linecap="round"/>
  <path d="M 560 430 Q 600 500 610 580" fill="none" stroke="#c9a06a" stroke-width="16" stroke-linecap="round"/>

  <!-- alveolar sacs: clusters of alveoli (grape-like) at the end of each duct branch -->
  <g fill="#f0c4b8" stroke="#8a5a4c" stroke-width="4">
    <!-- sac 1 -->
    <circle cx="470" cy="470" r="55"/>
    <circle cx="530" cy="450" r="50"/>
    <circle cx="500" cy="530" r="52"/>
    <circle cx="560" cy="520" r="48"/>
    <!-- sac 2 -->
    <circle cx="600" cy="620" r="55"/>
    <circle cx="660" cy="600" r="50"/>
    <circle cx="630" cy="680" r="52"/>
    <circle cx="695" cy="665" r="48"/>
    <!-- sac 3, upper branch -->
    <circle cx="640" cy="380" r="52"/>
    <circle cx="700" cy="360" r="48"/>
    <circle cx="675" cy="440" r="50"/>
    <circle cx="735" cy="420" r="46"/>
  </g>
  <path d="M 560 430 Q 610 400 640 380" fill="none" stroke="#c9a06a" stroke-width="14" stroke-linecap="round"/>

  <!-- individual alveolus interior detail (one enlarged, uncolored outline showing the thin single-cell-layer wall) -->
  <circle cx="500" cy="530" r="52" fill="none" stroke="#8a5a4c" stroke-width="2" opacity="0.6"/>

  <!-- capillary mesh wrapped around the alveolar sacs, as the site of gas exchange -->
  <g stroke="#4a6fa5" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 420 440 Q 470 400 530 400 Q 590 400 610 450"/>
    <path d="M 440 560 Q 500 600 570 600 Q 640 600 670 650"/>
    <path d="M 600 340 Q 660 320 710 340 Q 750 355 760 400"/>
  </g>
</svg>
