<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100">
  <rect x="0" y="0" width="1200" height="1100" fill="#ffffff"/>

  <!-- Convention: viewer faces the patient, so the patient's RIGHT side of the heart
       (RA/RV) is drawn on the image-LEFT, and the patient's LEFT side (LA/LV) on the
       image-RIGHT -- the standard orientation used throughout this app's heart assets. -->

  <!-- ============ interatrial / interventricular septum band ============ -->
  <rect x="510" y="150" width="140" height="730" fill="#e9d9b8" stroke="#a8905f" stroke-width="4"/>

  <!-- ============ four chambers ============ -->
  <rect x="220" y="150" width="290" height="270" rx="46" fill="#e79a92" stroke="#8a3a34" stroke-width="6"/>  <!-- RA -->
  <rect x="650" y="140" width="330" height="260" rx="46" fill="#e79a92" stroke="#8a3a34" stroke-width="6"/> <!-- LA -->
  <rect x="220" y="470" width="290" height="380" rx="55" fill="#d97a6c" stroke="#7a3228" stroke-width="7"/> <!-- RV -->
  <rect x="640" y="450" width="380" height="430" rx="60" fill="#c9584a" stroke="#6a2a20" stroke-width="10"/> <!-- LV: thicker outline = thicker myocardial wall -->

  <!-- ============ AV valves (between atria and ventricles) ============ -->
  <!-- tricuspid valve: 3 leaflets, RA/RV junction -->
  <g stroke="#4a2018" stroke-width="4" fill="#f3d9b0">
    <path d="M 250 420 L 320 420 L 300 468 L 265 468 Z"/>
    <path d="M 335 420 L 405 420 L 390 468 L 350 468 Z"/>
    <path d="M 420 420 L 490 420 L 475 468 L 435 468 Z"/>
  </g>
  <!-- mitral valve: 2 leaflets, LA/LV junction -->
  <g stroke="#4a2018" stroke-width="4" fill="#f3d9b0">
    <path d="M 700 400 L 830 400 L 800 450 L 730 450 Z"/>
    <path d="M 845 400 L 950 400 L 925 450 L 865 450 Z"/>
  </g>

  <!-- chordae tendineae (thin lines) + papillary muscles (small rounded bumps) inside the ventricles -->
  <g stroke="#4a2018" stroke-width="3" fill="none">
    <line x1="282" y1="468" x2="270" y2="640"/>
    <line x1="282" y1="468" x2="330" y2="660"/>
    <line x1="370" y1="468" x2="330" y2="660"/>
    <line x1="370" y1="468" x2="420" y2="655"/>
    <line x1="455" y1="468" x2="420" y2="655"/>
    <line x1="455" y1="468" x2="460" y2="630"/>
  </g>
  <ellipse cx="270" cy="655" rx="26" ry="34" fill="#7a3228" stroke="#4a2018" stroke-width="4"/>
  <ellipse cx="330" cy="675" rx="26" ry="34" fill="#7a3228" stroke="#4a2018" stroke-width="4"/>
  <ellipse cx="420" cy="670" rx="26" ry="34" fill="#7a3228" stroke="#4a2018" stroke-width="4"/>

  <g stroke="#4a2018" stroke-width="3" fill="none">
    <line x1="765" y1="450" x2="740" y2="600"/>
    <line x1="765" y1="450" x2="820" y2="615"/>
    <line x1="905" y1="450" x2="820" y2="615"/>
    <line x1="905" y1="450" x2="900" y2="600"/>
  </g>
  <ellipse cx="740" cy="618" rx="30" ry="38" fill="#6a2a20" stroke="#4a2018" stroke-width="4"/>
  <ellipse cx="900" cy="618" rx="30" ry="38" fill="#6a2a20" stroke="#4a2018" stroke-width="4"/>

  <!-- ============ great vessel stubs (drawn before the semilunar valves, so the valve
       cusps stay fully visible on top at the base of each vessel) ============ -->
  <!-- SVC into RA (from above) -- deoxygenated blood, colored blue like the pulmonary artery -->
  <path d="M 330 150 L 330 40 L 400 40 L 400 150 Z" fill="#4a6fa5" opacity="0.92" stroke="#233a5c" stroke-width="4"/>
  <!-- IVC into RA (short stub, from below-left, kept clear of the RV box which starts at x=220) -- deoxygenated blood -->
  <path d="M 250 420 L 150 470 L 150 520 L 260 460 Z" fill="#4a6fa5" opacity="0.92" stroke="#233a5c" stroke-width="4"/>
  <!-- pulmonary trunk from RV: exits RV's top edge, curves out through the clear left margin, then branches at the top -->
  <path d="M 300 470 Q 150 460 130 300 Q 120 180 200 110 L 250 140 Q 190 195 198 300 Q 210 430 340 460 Z"
        fill="#4a6fa5" opacity="0.92" stroke="#233a5c" stroke-width="4"/>
  <path d="M 200 110 Q 260 60 340 75 L 330 118 Q 270 108 225 145 Z" fill="#4a6fa5" opacity="0.92" stroke="#233a5c" stroke-width="4"/>
  <path d="M 200 110 Q 150 55 90 60 L 95 105 Q 145 102 178 143 Z" fill="#4a6fa5" opacity="0.92" stroke="#233a5c" stroke-width="4"/>
  <!-- ascending aorta from LV: exits LV's top edge through the clear septum column, arches over the top (above both atria), descends on the right -->
  <path d="M 690 450 Q 600 440 590 300 Q 585 180 610 110 Q 650 55 730 60 Q 830 65 880 140 Q 905 185 900 260 L 850 258 Q 852 200 830 165 Q 795 112 730 108 Q 665 105 645 150 Q 632 190 636 300 Q 640 420 745 448 Z"
        fill="#c9536a" opacity="0.92" stroke="#8a3040" stroke-width="4"/>
  <!-- pulmonary veins into LA (four short stubs from the right/upper-right, clear of the aorta's path) -->
  <path d="M 980 220 L 1080 190 L 1080 225 L 985 255 Z" fill="#c9536a" opacity="0.85" stroke="#8a3040" stroke-width="4"/>
  <path d="M 980 290 L 1085 285 L 1085 320 L 980 322 Z" fill="#c9536a" opacity="0.85" stroke="#8a3040" stroke-width="4"/>
  <path d="M 975 350 L 1075 375 L 1065 408 L 970 382 Z" fill="#c9536a" opacity="0.85" stroke="#8a3040" stroke-width="4"/>
  <path d="M 960 400 L 1050 445 L 1030 475 L 950 432 Z" fill="#c9536a" opacity="0.85" stroke="#8a3040" stroke-width="4"/>

  <!-- ============ semilunar valves (at the base of the great arteries, drawn on top of the vessel stubs so the cusps stay fully visible) ============ -->
  <!-- pulmonic valve: 3 cusps at RV -> pulmonary trunk junction -->
  <g stroke="#233a5c" stroke-width="5" fill="#bcd0e8">
    <path d="M 340 468 Q 330 425 365 415 Q 380 445 360 468 Z"/>
    <path d="M 420 468 Q 430 422 395 414 Q 380 445 400 468 Z"/>
    <path d="M 340 468 L 420 468 Q 380 480 340 468 Z"/>
  </g>
  <!-- aortic valve: 3 cusps at LV -> aorta junction (offset right, clear of the aorta's own tube) -->
  <g stroke="#8a3040" stroke-width="5" fill="#f0c0c8">
    <path d="M 800 448 Q 790 405 830 396 Q 848 430 822 448 Z"/>
    <path d="M 860 448 Q 870 402 830 394 Q 812 430 838 448 Z"/>
    <path d="M 800 448 L 860 448 Q 830 462 800 448 Z"/>
  </g>

  <!-- legend-free geometric key (color only) placed in the margin, matching each structure family -->
  <circle cx="1150" cy="1000" r="14" fill="#e79a92" stroke="#8a3a34" stroke-width="3"/>
  <circle cx="1150" cy="1040" r="14" fill="#c9584a" stroke="#6a2a20" stroke-width="3"/>
  <circle cx="1150" cy="1080" r="14" fill="#4a6fa5" stroke="#233a5c" stroke-width="3"/>
</svg>
