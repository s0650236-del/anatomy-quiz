<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100">
  <rect x="0" y="0" width="1200" height="1100" fill="#ffffff"/>

  <!-- heart outline (four-chamber silhouette, muted so the conduction pathway reads clearly on top).
       Convention: patient's right = image-left, consistent with the other heart assets. -->
  <rect x="220" y="150" width="290" height="270" rx="46" fill="#f3ded9" stroke="#b89a90" stroke-width="5"/>  <!-- RA -->
  <rect x="650" y="140" width="330" height="260" rx="46" fill="#f3ded9" stroke="#b89a90" stroke-width="5"/> <!-- LA -->
  <rect x="220" y="470" width="290" height="380" rx="55" fill="#f0d2ca" stroke="#b89a90" stroke-width="5"/> <!-- RV -->
  <rect x="640" y="450" width="380" height="430" rx="60" fill="#ecc4ba" stroke="#b89a90" stroke-width="6"/> <!-- LV -->
  <rect x="510" y="150" width="140" height="730" fill="#efe4cc" stroke="#c9b98f" stroke-width="4"/> <!-- septum -->

  <!-- ============ conduction pathway ============ -->
  <!-- 1: SA node, upper wall of RA -->
  <circle cx="290" cy="210" r="26" fill="#e0862f" stroke="#8a4f13" stroke-width="5"/>

  <!-- internodal pathways: SA node -> AV node, along the RA wall -->
  <path d="M 310 225 Q 400 300 460 400" fill="none" stroke="#e0862f" stroke-width="8" stroke-linecap="round"/>

  <!-- 2: AV node, lower septal wall of RA near the RV junction -->
  <circle cx="470" cy="415" r="24" fill="#c04a2f" stroke="#7a2a15" stroke-width="5"/>

  <!-- 3: bundle of His, through the septum -->
  <path d="M 480 435 L 570 470 L 578 560" fill="none" stroke="#c04a2f" stroke-width="10" stroke-linecap="round"/>

  <!-- branch point -->
  <circle cx="578" cy="562" r="14" fill="#7a2a15"/>

  <!-- 4: right bundle branch, down through RV wall toward the apex -->
  <path d="M 578 562 Q 480 610 400 700 Q 360 760 350 810" fill="none" stroke="#2f6fbf" stroke-width="8" stroke-linecap="round"/>

  <!-- 4: left bundle branch, down through LV wall toward the apex -->
  <path d="M 578 562 Q 700 610 780 700 Q 830 760 840 820" fill="none" stroke="#2f6fbf" stroke-width="8" stroke-linecap="round"/>

  <!-- 5: Purkinje fibre network, fine branching at both ventricular walls/apex -->
  <g stroke="#2f9f5f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 350 810 L 300 850"/>
    <path d="M 350 810 L 340 865"/>
    <path d="M 350 810 L 390 860"/>
    <path d="M 350 810 L 420 830"/>
    <path d="M 300 850 L 270 880"/>
    <path d="M 340 865 L 330 905"/>
    <path d="M 390 860 L 400 900"/>

    <path d="M 840 820 L 890 855"/>
    <path d="M 840 820 L 850 870"/>
    <path d="M 840 820 L 800 862"/>
    <path d="M 840 820 L 770 830"/>
    <path d="M 890 855 L 920 885"/>
    <path d="M 850 870 L 860 910"/>
    <path d="M 800 862 L 790 905"/>
  </g>

  <!-- legend-free geometric key (color+shape only) -->
  <circle cx="80" cy="60" r="16" fill="#e0862f" stroke="#8a4f13" stroke-width="4"/>
  <circle cx="80" cy="110" r="16" fill="#c04a2f" stroke="#7a2a15" stroke-width="4"/>
  <rect x="65" y="150" width="30" height="12" fill="#2f6fbf"/>
  <rect x="65" y="190" width="30" height="8" fill="#2f9f5f"/>
</svg>
