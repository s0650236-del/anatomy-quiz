<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700">
  <rect x="0" y="0" width="1400" height="700" fill="#fff6f6"/>

  <!-- ECG graph paper grid: thin 1mm lines + thick 5mm lines. This grid is the one
       exception to the "no non-answer marks" rule, since it is an intrinsic, unavoidable
       part of how an ECG trace is conventionally displayed. -->
  <g stroke="#f3c6c6" stroke-width="1">
    <!-- vertical thin lines every 20px -->
  </g>
  <g id="thin-grid" stroke="#f6d5d5" stroke-width="1.5"></g>
  <g id="thick-grid" stroke="#eba3a3" stroke-width="2.5"></g>

  <!-- generate grid programmatically is not possible in static SVG, so lay out explicit lines -->
  <g stroke="#f6d5d5" stroke-width="1.5">
    <line x1="20" y1="0" x2="20" y2="700"/><line x1="40" y1="0" x2="40" y2="700"/><line x1="60" y1="0" x2="60" y2="700"/><line x1="80" y1="0" x2="80" y2="700"/>
    <line x1="120" y1="0" x2="120" y2="700"/><line x1="140" y1="0" x2="140" y2="700"/><line x1="160" y1="0" x2="160" y2="700"/><line x1="180" y1="0" x2="180" y2="700"/>
    <line x1="220" y1="0" x2="220" y2="700"/><line x1="240" y1="0" x2="240" y2="700"/><line x1="260" y1="0" x2="260" y2="700"/><line x1="280" y1="0" x2="280" y2="700"/>
    <line x1="320" y1="0" x2="320" y2="700"/><line x1="340" y1="0" x2="340" y2="700"/><line x1="360" y1="0" x2="360" y2="700"/><line x1="380" y1="0" x2="380" y2="700"/>
    <line x1="420" y1="0" x2="420" y2="700"/><line x1="440" y1="0" x2="440" y2="700"/><line x1="460" y1="0" x2="460" y2="700"/><line x1="480" y1="0" x2="480" y2="700"/>
    <line x1="520" y1="0" x2="520" y2="700"/><line x1="540" y1="0" x2="540" y2="700"/><line x1="560" y1="0" x2="560" y2="700"/><line x1="580" y1="0" x2="580" y2="700"/>
    <line x1="620" y1="0" x2="620" y2="700"/><line x1="640" y1="0" x2="640" y2="700"/><line x1="660" y1="0" x2="660" y2="700"/><line x1="680" y1="0" x2="680" y2="700"/>
    <line x1="720" y1="0" x2="720" y2="700"/><line x1="740" y1="0" x2="740" y2="700"/><line x1="760" y1="0" x2="760" y2="700"/><line x1="780" y1="0" x2="780" y2="700"/>
    <line x1="820" y1="0" x2="820" y2="700"/><line x1="840" y1="0" x2="840" y2="700"/><line x1="860" y1="0" x2="860" y2="700"/><line x1="880" y1="0" x2="880" y2="700"/>
    <line x1="920" y1="0" x2="920" y2="700"/><line x1="940" y1="0" x2="940" y2="700"/><line x1="960" y1="0" x2="960" y2="700"/><line x1="980" y1="0" x2="980" y2="700"/>
    <line x1="1020" y1="0" x2="1020" y2="700"/><line x1="1040" y1="0" x2="1040" y2="700"/><line x1="1060" y1="0" x2="1060" y2="700"/><line x1="1080" y1="0" x2="1080" y2="700"/>
    <line x1="1120" y1="0" x2="1120" y2="700"/><line x1="1140" y1="0" x2="1140" y2="700"/><line x1="1160" y1="0" x2="1160" y2="700"/><line x1="1180" y1="0" x2="1180" y2="700"/>
    <line x1="1220" y1="0" x2="1220" y2="700"/><line x1="1240" y1="0" x2="1240" y2="700"/><line x1="1260" y1="0" x2="1260" y2="700"/><line x1="1280" y1="0" x2="1280" y2="700"/>
    <line x1="1320" y1="0" x2="1320" y2="700"/><line x1="1340" y1="0" x2="1340" y2="700"/><line x1="1360" y1="0" x2="1360" y2="700"/><line x1="1380" y1="0" x2="1380" y2="700"/>

    <line x1="0" y1="20" x2="1400" y2="20"/><line x1="0" y1="40" x2="1400" y2="40"/><line x1="0" y1="60" x2="1400" y2="60"/><line x1="0" y1="80" x2="1400" y2="80"/>
    <line x1="0" y1="120" x2="1400" y2="120"/><line x1="0" y1="140" x2="1400" y2="140"/><line x1="0" y1="160" x2="1400" y2="160"/><line x1="0" y1="180" x2="1400" y2="180"/>
    <line x1="0" y1="220" x2="1400" y2="220"/><line x1="0" y1="240" x2="1400" y2="240"/><line x1="0" y1="260" x2="1400" y2="260"/><line x1="0" y1="280" x2="1400" y2="280"/>
    <line x1="0" y1="320" x2="1400" y2="320"/><line x1="0" y1="340" x2="1400" y2="340"/><line x1="0" y1="360" x2="1400" y2="360"/><line x1="0" y1="380" x2="1400" y2="380"/>
    <line x1="0" y1="420" x2="1400" y2="420"/><line x1="0" y1="440" x2="1400" y2="440"/><line x1="0" y1="460" x2="1400" y2="460"/><line x1="0" y1="480" x2="1400" y2="480"/>
    <line x1="0" y1="520" x2="1400" y2="520"/><line x1="0" y1="540" x2="1400" y2="540"/><line x1="0" y1="560" x2="1400" y2="560"/><line x1="0" y1="580" x2="1400" y2="580"/>
    <line x1="0" y1="620" x2="1400" y2="620"/><line x1="0" y1="640" x2="1400" y2="640"/><line x1="0" y1="660" x2="1400" y2="660"/><line x1="0" y1="680" x2="1400" y2="680"/>
  </g>
  <g stroke="#eba3a3" stroke-width="2.5">
    <line x1="0" y1="0" x2="1400" y2="0"/><line x1="0" y1="100" x2="1400" y2="100"/><line x1="0" y1="200" x2="1400" y2="200"/><line x1="0" y1="300" x2="1400" y2="300"/>
    <line x1="0" y1="400" x2="1400" y2="400"/><line x1="0" y1="500" x2="1400" y2="500"/><line x1="0" y1="600" x2="1400" y2="600"/><line x1="0" y1="700" x2="1400" y2="700"/>
    <line x1="0" y1="0" x2="0" y2="700"/><line x1="100" y1="0" x2="100" y2="700"/><line x1="200" y1="0" x2="200" y2="700"/><line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/><line x1="500" y1="0" x2="500" y2="700"/><line x1="600" y1="0" x2="600" y2="700"/><line x1="700" y1="0" x2="700" y2="700"/>
    <line x1="800" y1="0" x2="800" y2="700"/><line x1="900" y1="0" x2="900" y2="700"/><line x1="1000" y1="0" x2="1000" y2="700"/><line x1="1100" y1="0" x2="1100" y2="700"/>
    <line x1="1200" y1="0" x2="1200" y2="700"/><line x1="1300" y1="0" x2="1300" y2="700"/><line x1="1400" y1="0" x2="1400" y2="700"/>
  </g>

  <!-- one full P-QRS-T cardiac cycle, single lead trace -->
  <path d="M 40 400
           L 130 400
           Q 165 400 180 365
           Q 195 400 230 400
           L 300 400
           L 320 400
           L 335 430
           L 355 130
           L 380 480
           L 410 400
           L 460 400
           Q 500 400 520 400
           Q 560 300 620 300
           Q 680 300 720 400
           L 900 400
           L 990 400
           Q 1025 400 1040 365
           Q 1055 400 1090 400
           L 1160 400
           L 1180 400
           L 1195 430
           L 1215 130
           L 1240 480
           L 1270 400
           L 1320 400"
        fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
