<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300">
  <rect x="0" y="0" width="1400" height="1300" fill="#ffffff"/>

  <!-- hierarchical airway branching tree: trachea -> carina -> main bronchi -> lobar bronchi
       -> segmental bronchi -> terminal/respiratory bronchioles (thinning at each level). -->

  <!-- trachea -->
  <rect x="665" y="20" width="70" height="160" rx="18" fill="#8fa8b8" stroke="#4a6478" stroke-width="5"/>

  <!-- carina / main bronchi (level 1) -->
  <path d="M 670 180 Q 560 220 470 320" fill="none" stroke="#8fa8b8" stroke-width="42" stroke-linecap="round"/>
  <path d="M 730 180 Q 850 220 950 320" fill="none" stroke="#8fa8b8" stroke-width="42" stroke-linecap="round"/>
  <circle cx="700" cy="180" r="10" fill="#4a6478"/>

  <!-- lobar bronchi (level 2): right side splits into 3 (upper/middle/lower), left into 2 (upper/lower) -->
  <path d="M 470 320 Q 400 340 340 400" fill="none" stroke="#9ab8a0" stroke-width="26" stroke-linecap="round"/>
  <path d="M 470 320 Q 460 380 430 440" fill="none" stroke="#9ab8a0" stroke-width="26" stroke-linecap="round"/>
  <path d="M 470 320 Q 470 420 500 520" fill="none" stroke="#9ab8a0" stroke-width="26" stroke-linecap="round"/>

  <path d="M 950 320 Q 1010 350 1050 420" fill="none" stroke="#9ab8a0" stroke-width="26" stroke-linecap="round"/>
  <path d="M 950 320 Q 940 420 920 520" fill="none" stroke="#9ab8a0" stroke-width="26" stroke-linecap="round"/>

  <!-- segmental bronchi (level 3): each lobar branch splits again -->
  <g stroke="#c9a06a" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 340 400 Q 280 420 240 470"/>
    <path d="M 340 400 Q 320 450 300 500"/>
    <path d="M 430 440 Q 390 470 360 520"/>
    <path d="M 430 440 Q 440 490 430 540"/>
    <path d="M 500 520 Q 460 560 430 610"/>
    <path d="M 500 520 Q 520 570 510 630"/>

    <path d="M 1050 420 Q 1100 450 1130 500"/>
    <path d="M 1050 420 Q 1070 470 1060 520"/>
    <path d="M 920 520 Q 950 570 950 630"/>
    <path d="M 920 520 Q 880 560 860 610"/>
  </g>

  <!-- terminal / respiratory bronchioles (level 4): thin, more numerous branches at each tip -->
  <g stroke="#c96a5a" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 240 470 L 200 510"/><path d="M 240 470 L 220 520"/><path d="M 240 470 L 260 515"/>
    <path d="M 300 500 L 270 540"/><path d="M 300 500 L 310 545"/>
    <path d="M 360 520 L 330 560"/><path d="M 360 520 L 370 565"/>
    <path d="M 430 540 L 410 585"/><path d="M 430 540 L 450 580"/>
    <path d="M 430 610 L 405 650"/><path d="M 430 610 L 445 655"/>
    <path d="M 510 630 L 490 675"/><path d="M 510 630 L 525 675"/>

    <path d="M 1130 500 L 1160 540"/><path d="M 1130 500 L 1145 545"/>
    <path d="M 1060 520 L 1080 565"/><path d="M 1060 520 L 1040 560"/>
    <path d="M 950 630 L 965 675"/><path d="M 950 630 L 930 670"/>
    <path d="M 860 610 L 840 655"/><path d="M 860 610 L 875 655"/>
  </g>

  <!-- tiny alveolar clusters at the very tips (context only, not a separate teaching point here) -->
  <g fill="#e8b8ac" stroke="#8a5a4c" stroke-width="2.5">
    <circle cx="200" cy="518" r="8"/><circle cx="220" cy="528" r="8"/><circle cx="260" cy="523" r="8"/>
    <circle cx="270" cy="548" r="8"/><circle cx="310" cy="553" r="8"/>
    <circle cx="330" cy="568" r="8"/><circle cx="370" cy="573" r="8"/>
    <circle cx="410" cy="593" r="8"/><circle cx="450" cy="588" r="8"/>
    <circle cx="405" cy="658" r="8"/><circle cx="445" cy="663" r="8"/>
    <circle cx="490" cy="683" r="8"/><circle cx="525" cy="683" r="8"/>
    <circle cx="1160" cy="548" r="8"/><circle cx="1145" cy="553" r="8"/>
    <circle cx="1080" cy="573" r="8"/><circle cx="1040" cy="568" r="8"/>
    <circle cx="965" cy="683" r="8"/><circle cx="930" cy="678" r="8"/>
    <circle cx="840" cy="663" r="8"/><circle cx="875" cy="663" r="8"/>
  </g>
</svg>
