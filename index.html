<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155eef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="人体クイズ">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="看護学科1年生向け「人体の構造と機能」試験対策クイズ。総論・循環器・呼吸器・泌尿器を分野別またはランダムに出題します。">
  <title>人体の構造と機能｜試験対策クイズ v2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-512.png">
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#dfe3ea;--primary:#155eef;--primary-soft:#eef4ff;--ok:#067647;--ok-soft:#ecfdf3;--ng:#b42318;--ng-soft:#fef3f2;--shadow:0 8px 24px rgba(16,24,40,.06)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.65;padding-bottom:env(safe-area-inset-bottom)}
    button,select{font:inherit}
    button{touch-action:manipulation}
    button:focus-visible,select:focus-visible,.img-wrap:focus-visible,.chip:focus-visible{outline:3px solid #84adff;outline-offset:2px}
    .app{max-width:900px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 32px;padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
    .header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
    .title{font-size:25px;font-weight:800;letter-spacing:.01em;line-height:1.35}
    .subtitle{font-size:13px;color:var(--muted);margin-top:5px}
    .mini{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:6px;text-align:right}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
    .settings-title{font-size:12px;color:var(--muted);margin-bottom:8px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .chip{border:1px solid #cfd5df;background:#fff;color:#475467;border-radius:999px;padding:9px 13px;min-height:44px;cursor:pointer}
    .chip.active{border-color:#84adff;background:var(--primary-soft);color:#1849a9;font-weight:700}
    .chip:disabled{opacity:.55;cursor:default}
    .controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px}
    .control{background:#f9fafb;border:1px solid #eaecf0;border-radius:13px;padding:11px}
    .control label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
    select,.btn{width:100%;min-height:46px;border-radius:11px;border:1px solid #d0d5dd;background:#fff;color:var(--text);padding:9px 11px}
    .btn{cursor:pointer;font-weight:700}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.secondary{background:#fff;color:#344054}
    .btn.ghost{background:#f9fafb;color:#475467}
    .btn.small{min-height:38px;width:auto;padding:7px 14px;font-size:13px}
    .btn:disabled{opacity:.55;cursor:default}
    .history-toggle{margin-top:2px}
    .history-panel{margin-top:12px;border-top:1px solid #eaecf0;padding-top:12px}
    .history-summary{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px}
    .history-summary strong{font-size:22px;color:var(--primary)}
    table.history-table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
    table.history-table th,table.history-table td{padding:8px 6px;border-bottom:1px solid #eaecf0;text-align:left}
    table.history-table td:last-child,table.history-table th:last-child{text-align:right;white-space:nowrap}
    .history-empty{color:var(--muted);font-size:13px;padding:6px 0 10px}
    .progress{height:7px;background:#e4e7ec;border-radius:999px;overflow:hidden;margin:12px 1px 14px}
    .progress>div{height:100%;background:var(--primary);width:0;transition:width .2s ease}
    .qtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:9px}
    .qcount{font-size:13px;color:#475467;margin-bottom:8px}
    .question{font-size:18px;font-weight:700;line-height:1.75;margin:0 0 12px}
    .img-wrap{position:relative;margin:0 0 16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#eef1f5;cursor:zoom-in;line-height:0}
    .img-wrap img{display:block;width:100%;height:auto}
    .img-wrap .zoom-hint{position:absolute;right:8px;bottom:8px;background:rgba(16,24,40,.68);color:#fff;font-size:11px;padding:5px 9px;border-radius:999px;line-height:1.4}
    .img-wrap.is-placeholder{cursor:default}
    .img-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:180px;padding:22px;text-align:center;color:#667085;background:repeating-linear-gradient(45deg,#f2f4f7,#f2f4f7 10px,#e9ecf1 10px,#e9ecf1 20px)}
    .img-placeholder .ph-title{font-weight:800;color:#475467}
    .img-placeholder .ph-alt{font-size:12px;color:#8a94a6;max-width:32em}
    .marker{position:absolute;transform:translate(-50%,-50%);background:var(--primary);color:#fff;font-weight:800;font-size:13px;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;box-shadow:0 0 0 2px #fff;pointer-events:none}
    .options{display:grid;gap:10px}
    .option{display:flex;width:100%;text-align:left;gap:11px;align-items:flex-start;border:1px solid #d0d5dd;background:#fff;border-radius:13px;padding:13px;min-height:54px;color:var(--text);cursor:pointer;line-height:1.65}
    .option:active{transform:scale(.997)}
    .option-text{flex:1}
    .badge{display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;height:30px;border:1px solid #c7ced8;border-radius:50%;color:#667085;font-size:12px;font-weight:800;margin-top:1px}
    .state-icon{display:inline-block;margin-left:8px;font-weight:800}
    .option.correct{border-color:#6ce9a6;background:var(--ok-soft)}
    .option.correct .badge{background:var(--ok);border-color:var(--ok);color:#fff}
    .option.correct .state-icon{color:var(--ok)}
    .option.wrong{border-color:#fda29b;background:var(--ng-soft)}
    .option.wrong .badge{background:var(--ng);border-color:var(--ng);color:#fff}
    .option.wrong .state-icon{color:var(--ng)}
    .feedback{margin-top:14px;border-radius:13px;padding:13px 14px;background:#f8fafc;border:1px solid #eaecf0}
    .feedback.ok{background:var(--ok-soft);border-color:#abefc6}
    .feedback.ng{background:var(--ng-soft);border-color:#fecdca}
    .feedback-head{font-weight:800;margin-bottom:4px}
    .feedback.ok .feedback-head{color:var(--ok)}
    .feedback.ng .feedback-head{color:var(--ng)}
    .correct-answer{font-size:14px;font-weight:700;margin:6px 0}
    .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    .actions .btn{flex:1;min-width:140px}
    .result{text-align:center;padding:10px 0 2px}
    .score{font-size:58px;font-weight:850;color:var(--primary);line-height:1.05;margin:8px 0}
    .result-msg{color:var(--muted);margin-bottom:16px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
    .stat{border:1px solid #eaecf0;background:#f9fafb;border-radius:12px;padding:12px 8px}
    .stat strong{display:block;font-size:23px;line-height:1.2}
    .stat span{font-size:11px;color:var(--muted)}
    .review{margin-top:14px;text-align:left}
    details{border-top:1px solid #eaecf0;padding:10px 0}
    summary{cursor:pointer;font-weight:700}
    .review-q{margin:8px 0 4px}
    .review-a{font-size:14px;color:#475467}
    .notice{font-size:12px;color:#475467;background:#fff8eb;border:1px solid #fedf89;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:none}
    .notice.error{color:#912018;background:#fef3f2;border-color:#fecdca;font-size:13px}
    .notice.show{display:block}
    .settings-collapsed{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    .settings-collapsed span{font-size:13px;color:var(--muted)}
    .footer{text-align:center;color:#98a2b3;font-size:11px;padding:5px 0 20px}
    .homehint{font-size:12px;color:#475467;margin-top:12px;text-align:center}
    .loading-card{text-align:center;color:var(--muted);padding:26px 10px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
    .modal-content{position:relative;max-width:min(92vw,760px);max-height:100%;width:100%}
    .modal-content .img-wrap{cursor:default;background:transparent;border:none}
    .modal-content .img-wrap img{max-height:78vh;width:auto;max-width:100%;margin:0 auto;border-radius:10px;background:#fff}
    .modal-close{position:absolute;top:-52px;right:0;background:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
    .modal-caption{color:#f2f4f7;font-size:13px;text-align:center;margin-top:10px}
    @media(max-width:680px){.app{padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}.header{display:block}.title{font-size:21px}.mini{padding-top:2px;text-align:left}.controls{grid-template-columns:1fr}.card{border-radius:15px;padding:14px}.question{font-size:17px}.actions{flex-direction:column}.actions .btn{min-width:0}.score{font-size:50px}.option{padding:12px 11px}.chip{padding:8px 11px}.modal-close{top:-48px;right:0}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div>
      <div class="title">人体の構造と機能｜試験対策クイズ</div>
      <div class="subtitle" id="subtitle">総論・循環器・呼吸器・泌尿器　問題データを読み込み中…</div>
    </div>
    <div class="mini" id="miniScore" aria-live="polite"></div>
  </header>

  <div class="notice show" id="fileNotice">学生の皆さんへ：このアプリは配布されたHTMLファイルを直接開くのではなく、GitHub PagesのURLをSafari等のブラウザで開いて利用してください。</div>
  <div class="notice error" id="loadError" role="alert"></div>

  <section class="card" id="settingsCard">
    <div id="settingsCollapsed" class="settings-collapsed" style="display:none">
      <span id="settingsSummary"></span>
      <button type="button" class="btn ghost small" id="changeSettingsBtn">出題範囲を変更</button>
    </div>
    <div id="settingsFull">
      <div class="settings-title">出題範囲</div>
      <div class="chips" id="chapterChips" role="group" aria-label="出題範囲を選択"></div>
      <div class="controls">
        <div class="control"><label for="countSelect">出題数</label><select id="countSelect" disabled></select></div>
        <div class="control"><label for="orderSelect">出題順</label><select id="orderSelect"><option value="random">ランダム</option><option value="sequential">順番どおり</option></select></div>
        <div class="control"><label>開始・再設定</label><button type="button" class="btn primary" id="startBtn" disabled>読み込み中…</button></div>
      </div>
      <button type="button" class="btn ghost history-toggle" id="historyToggleBtn" aria-expanded="false">学習履歴を見る</button>
      <div class="history-panel" id="historyPanel" style="display:none"></div>
    </div>
  </section>

  <div class="progress" id="progressWrap" aria-label="進捗" style="display:none"><div id="progressFill"></div></div>
  <main id="mainArea" aria-live="polite">
    <div class="card loading-card" id="initialLoading">問題データを読み込んでいます…</div>
  </main>
  <div class="homehint">iPhone／iPad：Safariで開き、共有 →「ホーム画面に追加」でアプリのように利用できます。</div>
  <div class="footer">学習用Webアプリ｜問題・解説データは data/questions_v1.json を利用</div>
</div>

<div class="modal-backdrop" id="zoomModal" style="display:none" role="dialog" aria-modal="true" aria-label="画像の拡大表示">
  <div class="modal-content">
    <button type="button" class="modal-close" id="zoomClose" aria-label="拡大表示を閉じる">✕</button>
    <div class="img-wrap" id="zoomImgWrap"></div>
    <div class="modal-caption" id="zoomCaption"></div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
